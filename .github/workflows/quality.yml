name: quality

on:
  push:
    branches: [main, "chore/**", "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            docs
            public/game-data/classic
            src
            tests
            tools
            .gitignore
            bun.lock
            index.html
            package.json
            README.md
            SECURITY.md
            tsconfig.json
            BASE759/SOURCERS/Source do Servidor/Code/DBSrv/dbMySQL.h
            BASE759/SOURCERS/Source do Servidor/Code/TMSrv/wMySQL.h
          sparse-checkout-cone-mode: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install
        run: bun install --frozen-lockfile

      - name: Validate
        run: bun run check
